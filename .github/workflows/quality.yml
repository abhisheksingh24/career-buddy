name: quality

# Accessibility (axe, WCAG 2.2 AA) and performance budget checks (issue #42,
# ADR 0012). Separate from ci.yml so a slow browser install never delays lint
# and tests. Needs no database and no services: the public pages are served
# from the production build with throwaway settings.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-perf:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        timeout-minutes: 10
        run: npm ci && npx prisma generate
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Build
        timeout-minutes: 10
        run: npm run build
      - name: Performance budget
        timeout-minutes: 2
        run: npm run perf:budget
      - name: Accessibility (axe)
        timeout-minutes: 5
        run: npm run test:a11y
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
