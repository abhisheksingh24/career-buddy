name: audit

# Dependency audit (quality bar): high or critical advisories in production
# dependencies fail the build, except those accepted in
# .github/audit-allowlist.json. A registry outage retries, then warns; it never
# fails the check (scripts/audit.mjs, ADR 0010).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        timeout-minutes: 5
        run: node scripts/audit.mjs
